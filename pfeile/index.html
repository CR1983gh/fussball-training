<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🧭 Pfeil-Reaktion</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #ffd400;
    --border: #30363d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    font-size: 15px;
    gap: 10px;
  }
  header .title { font-weight: 700; letter-spacing: .02em; }
  header a.back { color: var(--muted); font-size: 14px; white-space: nowrap; }
  header a.back:hover { color: var(--accent); }

  /* ---- Arrow display ---- */
  #displayWrap {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 12px;
    min-height: 45vh;
  }
  #arrowBox {
    width: min(92vw, 70vh, 620px);
    aspect-ratio: 1 / 1;
    border: 2px solid #6e7681;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    position: relative;
    gap: 2vmin;
  }
  #arrow {
    font-size: 40vmin;
    line-height: 1;
    font-weight: 700;
    color: var(--accent);
    user-select: none;
  }
  #count {
    font-size: 12vmin;
    line-height: 1;
    font-weight: 800;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    user-select: none;
    min-height: 0;
    visibility: hidden;
  }
  #count.visible { visibility: visible; }
  #hint {
    margin-top: 14px;
    font-size: clamp(14px, 4vw, 20px);
    color: var(--muted);
    text-align: center;
    min-height: 1.4em;
    user-select: none;
  }
  #drillTimer {
    margin-top: 4px;
    font-size: clamp(13px, 3.5vw, 17px);
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    min-height: 1.3em;
    user-select: none;
  }

  /* ---- Controls ---- */
  #controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 6px 14px 4px;
  }
  #startBtn {
    width: min(92vw, 420px);
    padding: 18px 20px;
    font-size: 22px;
    font-weight: 800;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    background: var(--accent);
    color: #0d1117;
    letter-spacing: .02em;
  }
  #startBtn:active { transform: scale(.985); }
  #startBtn.running { background: #21262d; color: var(--text); border: 2px solid var(--border); }

  #settingsToggle {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    padding: 6px 10px;
  }
  #settingsToggle:hover { color: var(--accent); }

  #settings {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    display: none;
    flex-direction: column;
    gap: 14px;
    text-align: left;
  }
  #settings.open { display: flex; }
  #settings label { font-size: 14px; color: var(--text); display: block; margin-bottom: 6px; }
  #settings .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  input[type="range"] {
    flex: 1 1 160px;
    accent-color: var(--accent);
    min-width: 140px;
  }
  #intervalVal { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3.2em; }
  select {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 15px;
  }
  select:focus { outline: 2px solid var(--accent); border-color: transparent; }

  .toggleRow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .switch { position: relative; display: inline-block; width: 52px; height: 30px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .sliderSw {
    position: absolute; inset: 0;
    background: #30363d;
    border-radius: 30px;
    transition: background .15s;
    cursor: pointer;
  }
  .sliderSw::before {
    content: "";
    position: absolute;
    width: 24px; height: 24px;
    left: 3px; top: 3px;
    background: #e6edf3;
    border-radius: 50%;
    transition: transform .15s;
  }
  .switch input:checked + .sliderSw { background: var(--accent); }
  .switch input:checked + .sliderSw::before { transform: translateX(22px); }

  footer {
    text-align: center;
    padding: 10px 0 14px;
    font-size: 11px;
    color: #484f58;
  }
  footer a { color: #484f58; }
  footer a:hover { color: var(--accent); }

  @media (min-width: 700px) {
    #startBtn { font-size: 24px; }
  }
</style>
</head>
<body>

<header>
  <span class="title">🧭 Pfeil-Reaktion</span>
  <a class="back" href="../index.html">← Training</a>
</header>

<div id="displayWrap">
  <div id="arrowBox">
    <span id="arrow">➡</span>
    <span id="count"></span>
  </div>
  <div id="hint">Pfeil = deine Richtung! Zahl = wie oft?</div>
  <div id="drillTimer"></div>
</div>

<div id="controls">
  <button id="startBtn" type="button">▶ Start</button>
  <button id="settingsToggle" type="button" aria-expanded="false">⚙ Einstellungen</button>

  <div id="settings">
    <div>
      <label for="intervalSlider">Intervall: <span id="intervalVal">1,0 s</span></label>
      <input type="range" id="intervalSlider" min="0.5" max="3.0" step="0.1" value="1.0">
    </div>

    <div>
      <label for="modeSelect">Modus</label>
      <select id="modeSelect">
        <option value="dir4" selected>4 Richtungen</option>
        <option value="dir4count">4 Richtungen + Anzahl</option>
        <option value="dir8">8 Richtungen</option>
      </select>
    </div>

    <div>
      <label for="drillSelect">Übungs-Timer</label>
      <select id="drillSelect">
        <option value="0" selected>Aus</option>
        <option value="2">2 Minuten</option>
        <option value="5">5 Minuten</option>
        <option value="10">10 Minuten</option>
      </select>
    </div>

    <div class="toggleRow">
      <label for="soundToggle" style="margin:0;">Signalton bei jedem Wechsel</label>
      <span class="switch">
        <input type="checkbox" id="soundToggle" checked>
        <span class="sliderSw"></span>
      </span>
    </div>
  </div>
</div>

<footer>
  <a href="https://cr1983gh.github.io/">⚓ Deck 7</a>
</footer>

<script>
(function () {
  "use strict";

  var LS_KEY = "zsConfig-pfeile";

  var DEFAULTS = {
    interval: 1.0,
    mode: "dir4",
    drillMin: 0,
    sound: true
  };

  var DIR4 = ["➡", "⬅", "⬆", "⬇"];
  var DIR8 = ["➡", "⬅", "⬆", "⬇", "↗", "↘", "↖", "↙"];

  var cfg = loadCfg();

  var elArrow    = document.getElementById("arrow");
  var elCount    = document.getElementById("count");
  var elHint     = document.getElementById("hint");
  var elTimer    = document.getElementById("drillTimer");
  var elStart    = document.getElementById("startBtn");
  var elToggle   = document.getElementById("settingsToggle");
  var elSettings = document.getElementById("settings");
  var elSlider   = document.getElementById("intervalSlider");
  var elIntVal   = document.getElementById("intervalVal");
  var elMode     = document.getElementById("modeSelect");
  var elDrill    = document.getElementById("drillSelect");
  var elSound    = document.getElementById("soundToggle");

  var running = false;      // arrows cycling
  var counting = false;     // 3-2-1 countdown active
  var timerId = null;       // setTimeout handle (single chain)
  var drillId = null;       // drill-end setTimeout handle
  var drillTickId = null;   // drill countdown display setTimeout chain
  var drillEndAt = null;    // epoch ms when drill ends
  var lastArrow = null;
  var audioCtx = null;

  /* ---------- persistence ---------- */
  function loadCfg() {
    var c = {};
    var k;
    for (k in DEFAULTS) { if (Object.prototype.hasOwnProperty.call(DEFAULTS, k)) c[k] = DEFAULTS[k]; }
    try {
      var raw = window.localStorage ? localStorage.getItem(LS_KEY) : null;
      if (raw) {
        var p = JSON.parse(raw);
        if (p && typeof p === "object") {
          if (typeof p.interval === "number" && p.interval >= 0.5 && p.interval <= 3.0) c.interval = p.interval;
          if (p.mode === "dir4" || p.mode === "dir4count" || p.mode === "dir8") c.mode = p.mode;
          if (p.drillMin === 0 || p.drillMin === 2 || p.drillMin === 5 || p.drillMin === 10) c.drillMin = p.drillMin;
          if (typeof p.sound === "boolean") c.sound = p.sound;
        }
      }
    } catch (e) { /* localStorage nicht verfuegbar oder kaputt -> Defaults */ }
    return c;
  }

  function saveCfg() {
    try {
      if (window.localStorage) localStorage.setItem(LS_KEY, JSON.stringify(cfg));
    } catch (e) { /* ignorieren */ }
  }

  /* ---------- audio ---------- */
  function ensureAudio() {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) { audioCtx = null; }
  }

  function beep(freq, durMs, whenOffset) {
    if (!cfg.sound || !audioCtx) return;
    try {
      var t0 = audioCtx.currentTime + (whenOffset || 0);
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.25, t0 + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + durMs / 1000);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + durMs / 1000 + 0.02);
    } catch (e) { /* ignorieren */ }
  }

  /* ---------- arrows ---------- */
  function pickArrow() {
    var set = cfg.mode === "dir8" ? DIR8 : DIR4;
    var a, guard = 0;
    do {
      a = set[Math.floor(Math.random() * set.length)];
      guard++;
    } while (a === lastArrow && guard < 50);
    lastArrow = a;
    return a;
  }

  function showSignal() {
    elArrow.textContent = pickArrow();
    if (cfg.mode === "dir4count") {
      elCount.textContent = String(1 + Math.floor(Math.random() * 3)); // 1..3
      elCount.classList.add("visible");
    } else {
      elCount.textContent = "";
      elCount.classList.remove("visible");
    }
  }

  function renderStatic() {
    elArrow.textContent = cfg.mode === "dir8" ? "↖" : "➡";
    if (cfg.mode === "dir4count") {
      elCount.textContent = "2";
      elCount.classList.add("visible");
    } else {
      elCount.textContent = "";
      elCount.classList.remove("visible");
    }
  }

  /* ---------- timer chain (setTimeout only) ---------- */
  function clearTimer() {
    if (timerId !== null) { clearTimeout(timerId); timerId = null; }
    if (drillId !== null) { clearTimeout(drillId); drillId = null; }
    if (drillTickId !== null) { clearTimeout(drillTickId); drillTickId = null; }
  }

  function tick() {
    showSignal();
    beep(1200, 50, 0);
    timerId = setTimeout(tick, cfg.interval * 1000);
  }

  function fmtClock(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000));
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  function drillTick() {
    if (!running && !counting) return;
    var rest = drillEndAt - Date.now();
    if (rest <= 0) {
      elTimer.textContent = "";
      return; // drillFinished wurde per drillId ausgeloest
    }
    elTimer.textContent = "⏱ " + fmtClock(rest);
    drillTickId = setTimeout(drillTick, 500);
  }

  function scheduleDrill() {
    if (cfg.drillMin > 0) {
      drillEndAt = Date.now() + cfg.drillMin * 60 * 1000;
      drillId = setTimeout(drillFinished, cfg.drillMin * 60 * 1000);
      drillTick();
    } else {
      drillEndAt = null;
      elTimer.textContent = "";
    }
  }

  function drillFinished() {
    drillId = null;
    pause();
    elArrow.textContent = "✅";
    elCount.classList.remove("visible");
    elTimer.textContent = "Fertig!";
    beep(900, 120, 0);
    beep(1100, 120, 0.16);
    beep(1400, 220, 0.32);
  }

  function startCountdown() {
    counting = true;
    running = false;
    clearTimer();
    lastArrow = null;
    elStart.textContent = "⏸ Pause";
    elStart.classList.add("running");
    elTimer.textContent = "";

    var steps = ["3", "2", "1"];
    var i = 0;

    function countStep() {
      if (!counting) return; // abgebrochen
      if (i < steps.length) {
        elArrow.textContent = steps[i];
        beep(400, 150, 0); // tief
        i++;
        timerId = setTimeout(countStep, 1000);
      } else {
        counting = false;
        elArrow.textContent = "LOS";
        beep(1400, 90, 0);
        beep(1400, 90, 0.12);
        running = true;
        scheduleDrill();
        timerId = setTimeout(tick, 400);
      }
    }
    countStep();
  }

  function pause() {
    counting = false;
    running = false;
    clearTimer();
    elStart.textContent = "▶ Start";
    elStart.classList.remove("running");
    elTimer.textContent = "";
    // letztes Signal bleibt stehen
  }

  function start() {
    ensureAudio();
    startCountdown();
  }

  /* ---------- UI events ---------- */
  elStart.addEventListener("click", function () {
    ensureAudio();
    if (running || counting) pause(); else start();
  });

  elToggle.addEventListener("click", function () {
    var open = elSettings.classList.toggle("open");
    elToggle.setAttribute("aria-expanded", open ? "true" : "false");
  });

  function fmtSec(v) { return v.toFixed(1).replace(".", ",") + " s"; }

  elSlider.addEventListener("input", function () {
    cfg.interval = Math.round(parseFloat(elSlider.value) * 10) / 10;
    elIntVal.textContent = fmtSec(cfg.interval);
    saveCfg();
    // laufender Wechsel uebernimmt beim naechsten Tick automatisch
  });

  elMode.addEventListener("change", function () {
    var m = elMode.value;
    cfg.mode = (m === "dir4count" || m === "dir8") ? m : "dir4";
    lastArrow = null;
    renderStatic();
    saveCfg();
  });

  elDrill.addEventListener("change", function () {
    var v = parseInt(elDrill.value, 10);
    cfg.drillMin = (v === 2 || v === 5 || v === 10) ? v : 0;
    saveCfg();
    // neu justierter Timer greift beim naechsten Start
  });

  elSound.addEventListener("change", function () {
    cfg.sound = elSound.checked;
    if (cfg.sound) ensureAudio();
    saveCfg();
  });

  /* ---------- background tab handling ---------- */
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && (running || counting)) {
      pause(); // sauber in den Pausen-Zustand, nicht mitten im Intervall weitertackern
    }
  });

  /* ---------- init ---------- */
  function init() {
    elSlider.value = String(cfg.interval);
    elIntVal.textContent = fmtSec(cfg.interval);
    elMode.value = cfg.mode;
    elDrill.value = String(cfg.drillMin);
    elSound.checked = !!cfg.sound;
    renderStatic();
  }

  init();
})();
</script>
</body>
</html>
